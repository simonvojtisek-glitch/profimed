<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Apps</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            text-align: center;
            background: white;
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 500px;
        }
        h1 {
            color: #333;
            margin-bottom: 1rem;
        }
        p {
            color: #666;
        }
        .apps {
            margin-top: 2rem;
            text-align: left;
        }
        .apps a {
            display: block;
            padding: 1rem;
            margin: 0.5rem 0;
            background: #f3f4f6;
            border-radius: 8px;
            color: #4f46e5;
            text-decoration: none;
            transition: background 0.2s;
        }
        .apps a:hover {
            background: #e0e7ff;
        }
        .status {
            display: inline-block;
            background: #10b981;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Web Apps</h1>
        <p>Available applications:</p>
        <div class="apps">
            <a href="chytre-materialy/dist/">Chytré Materiály - Category Tree Reorganization</a>
            <a href="agentic-commerce/">Agentic Commerce</a>
            <a href="outfindo/">Outfindo</a>
        </div>
        <span class="status">Status: OK</span>
    </div>
</body>
</html>
